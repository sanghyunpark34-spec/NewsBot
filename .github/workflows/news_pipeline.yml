name: News Automation Pipeline

on:
  workflow_dispatch:
    inputs:
      is_scheduled:
        description: 'cron-job.org 스케줄 가동 여부'
        required: false
        default: 'false'
      run_type:
        description: '실행 모드 (full / report_only)'
        required: false
        default: 'full'

jobs:
  automation-orchestrator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gspread oauth2client requests google-genai pytz holidays groq pandas anthropic

      - name: Run Orchestrator Pipeline
        env:
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_GROUP_CHAT_ID: ${{ secrets.GROUP_CHAT_ID }}
          MY_CHAT_ID: ${{ secrets.MY_CHAT_ID }}
        run: |
          if [ "${{ github.event.inputs.is_scheduled }}" == "true" ]; then
            export GITHUB_EVENT_NAME="schedule"
          else
            export GITHUB_EVENT_NAME="workflow_dispatch"
          fi
          
          # 👇 런 타입이 report_only면 발송 파일만 단독으로 실행합니다.
          if [ "${{ github.event.inputs.run_type }}" == "report_only" ]; then
            echo "🚀 메세지 즉시 발송 모드로 단독 실행합니다."
            python telegram_reporter.py
          else
            echo "🚀 전체 뉴스 수집 및 분석 파이프라인을 실행합니다."
            python orchestrator.py
          fi
